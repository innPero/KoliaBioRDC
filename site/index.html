<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferme Luzolo - Appwrite</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
  <script src="./config.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>🥬 Ferme Luzolo</h1>
    <nav>
      <button data-route="catalogue">Catalogue</button>
      <button data-route="panier">Panier</button>
      <button data-route="compte">Mon espace</button>
      <button data-route="admin">Admin</button>
    </nav>
  </header>

  <main class="container">
    <section id="flash"></section>

    <section id="view-catalogue" class="view">
      <h2>Produits</h2>
      <div id="products" class="cards"></div>
    </section>

    <section id="view-panier" class="view hidden">
      <h2>Panier</h2>
      <div id="cart"></div>
      <form id="checkout-form">
        <h3>Commande</h3>
        <label>Nom <input name="client_nom" required /></label>
        <label>Email <input name="client_email" type="email" required /></label>
        <label>Téléphone <input name="client_tel" required /></label>
        <label>Point retrait
          <select name="point_retrait" required>
            <option>🏬 Boutique Gombe (Boulevard du 30 Juin)</option>
            <option>🏬 Boutique Limete (7ème Rue)</option>
            <option>🏬 Boutique Bandalungwa (Avenue Kimbondo)</option>
            <option>🏬 Boutique Kintambo (Rond-point Magasin)</option>
          </select>
        </label>
        <label>Paiement
          <select name="payment_method" id="payment_method">
            <option value="cod">Paiement en boutique</option>
            <option value="mobile_money">Mobile Money</option>
          </select>
        </label>
        <label>Opérateur mobile <input name="mobile_operator" /></label>
        <label>Numéro mobile <input name="mobile_number" /></label>
        <label>Note <textarea name="note" maxlength="500"></textarea></label>
        <button type="submit">Valider commande</button>
      </form>
    </section>

    <section id="view-compte" class="view hidden">
      <h2>Compte client</h2>
      <div id="auth-block">
        <form id="register-form">
          <h3>Créer un compte</h3>
          <label>Nom <input name="nom" required /></label>
          <label>Email <input name="email" type="email" required /></label>
          <label>Mot de passe <input name="password" type="password" minlength="8" required /></label>
          <button type="submit">Inscription</button>
        </form>
        <form id="login-form">
          <h3>Connexion</h3>
          <label>Email <input name="email" type="email" required /></label>
          <label>Mot de passe <input name="password" type="password" required /></label>
          <button type="submit">Connexion</button>
        </form>
      </div>
      <div id="profile-block" class="hidden">
        <p id="profile-line"></p>
        <button id="logout-btn">Déconnexion</button>
        <h3>Mes commandes</h3>
        <ul id="my-orders"></ul>
      </div>
    </section>

    <section id="view-admin" class="view hidden">
      <h2>Administration</h2>
      <p>Accès via team admin Appwrite + Functions dédiées.</p>
      <div class="admin-actions">
        <button id="refresh-admin-orders">Actualiser commandes</button>
        <ul id="admin-orders"></ul>
      </div>
    </section>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
